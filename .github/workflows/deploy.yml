name: Deploy Angular (refactor)

on:
  push:
    branches:
      - refactor
  workflow_dispatch:

concurrency:
  group: deploy-angular-refactor
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for version info)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy on Hetzner via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_VERSION: "0.2.${{ github.run_number }}"
          GIT_COMMIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          passphrase: ${{ secrets.HETZNER_SSH_PASSPHRASE }}
          port: 22
          envs: APP_VERSION,GIT_COMMIT_SHA
          script_stop: true
          script: |
            set -e
            cd /opt/vasilis

            git fetch origin --tags
            git checkout refactor
            git reset --hard origin/refactor

            APP_BUILD_DATE=$(git log -1 --format=%cI)

            cd /opt
            docker-compose build \
              --build-arg APP_VERSION=$APP_VERSION \
              --build-arg GIT_COMMIT_SHA=$GIT_COMMIT_SHA \
              --build-arg APP_BUILD_DATE=$APP_BUILD_DATE \
              angular
            docker-compose up -d angular
            docker-compose ps angular

