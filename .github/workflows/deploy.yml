name: Deploy Angular (refactor)

on:
  push:
    branches:
      - refactor
  workflow_dispatch:

concurrency:
  group: deploy-angular-refactor
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on Hetzner via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          passphrase: ${{ secrets.HETZNER_SSH_PASSPHRASE }}
          port: 22
          script_stop: true
          script: |
            set -e
            cd /opt/vasilis

            git fetch origin --tags
            git checkout refactor
            git pull origin refactor

            # Extract version info for Docker build
            APP_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || grep '"version"' package.json | head -1 | sed 's/.*: "//;s/".*//')
            GIT_COMMIT_SHA=$(git rev-parse HEAD)
            APP_BUILD_DATE=$(git log -1 --format=%cI)

            cd /opt
            docker-compose build --build-arg APP_VERSION=$APP_VERSION --build-arg GIT_COMMIT_SHA=$GIT_COMMIT_SHA --build-arg APP_BUILD_DATE=$APP_BUILD_DATE angular
            docker-compose up -d angular
            docker-compose ps angular

