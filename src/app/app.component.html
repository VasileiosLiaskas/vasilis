<div class="main-layout">
  <app-header *ngIf="isAuthenticated"></app-header>
  <app-toaster></app-toaster>

  <!-- This is your intentional empty space (tabs) - show only when authenticated -->
  <div *ngIf="isAuthenticated" class="spacer">
    <div class="tabs-menu">
      <button class="tab" [class.active]="activeTab === 'business'" (click)="navigate('business')">
        <i class="fa-solid fa-briefcase"></i>
        <span>Δουλειές</span>
      </button>

      <button class="tab" [class.active]="activeTab === 'invoices'" (click)="navigate('invoices')">
        <i class="fa-solid fa-file-invoice"></i>
        <span>Τιμολόγια</span>
      </button>

      <button class="tab" [class.active]="activeTab === 'stats'" (click)="navigate('stats')">
        <i class="fa-solid fa-chart-column"></i>
        <span>Στατιστικά</span>
      </button>

      <span class="underline" [ngStyle]="{ left: underlinePosition }"></span>
    </div>
  </div>

  <!-- This is where your page content (e.g. table) appears -->
  <div class="content">
    <router-outlet></router-outlet>
  </div>
</div>
<style>
  .main-layout {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* This div creates the empty space */
  .spacer {
    flex-shrink: 0;
    padding: 0.5rem 1rem;
    background: #f1f1f1;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Content below the spacer */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start; /* or flex-end if you still want it near bottom */
  }
</style>
