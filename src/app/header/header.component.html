
<header>
    <div class="logo" >
      <img src="logo.png" alt="Logo" class="logo-image">
    </div>

  <div class="icons">
    <i (click)="openBusiness()" class="fa-solid fa-money-bill papers"></i>
    <i (click)="openInvoices()" class="fa-solid fa-newspaper papers"></i>
    <i (click)="openCalendar()" class="fa-solid fa-calendar-days calendar "></i>
    <i class="fa-solid fa-user profile" (click)="toggleLogoMenu()"></i>
    <div class="profile-dropdown" *ngIf="showLogoMenu">
      <ul>
        <li (click)="menuAction('myProfile')">Το προφίλ μου</li>
        <li (click)="menuAction('settings')">Ρυθμίσεις</li>
        <li (click)="menuAction('logout')">Έξοδος</li>
      </ul>
    </div>

  </div>
</header>

<div *ngIf="calendarView" id="calendarModal" class="modal">

<div class="modal-content">
  <iframe  class="calendar-container" src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=Europe%2FAthens&showPrint=0&src=Y29jb2JpbGxvY29AZ21haWwuY29t&src=MWFjM2VjZDc1YTY5NGEzMWRjNmVhMTI0MzY3NWU1OGE5ZDBmNzExZjliYzU1ZDBlZTI3N2MyOWUzYTI5OWVmZkBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=ZWwuZ3JlZWsjaG9saWRheUBncm91cC52LmNhbGVuZGFyLmdvb2dsZS5jb20&color=%234285F4&color=%23ae1304&color=%23F6BF26" style="border:solid 1px #777"  frameborder="0" scrolling="no"></iframe>
  <span class="close" (click)="closeCalendar()">&times;</span>
</div>
</div>
