<div class="login-page">
  <div class="login-card">
    <div class="login-hero">
      <div class="brand-mark">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <p class="eyebrow">motherfucker</p>
      <h1>Welcome back</h1>
      <!--<p class="subtitle">Sign in to manage your invoices, customers, and business activity.</p>-->
    </div>

    <form class="login-form" (ngSubmit)="onLogin()">
      <div class="form-field">
        <label for="username">Username</label>
        <div class="input-box">
          <i class="fa-solid fa-user"></i>
          <input
            id="username"
            type="text"
            placeholder="Enter your username"
            [(ngModel)]="username"
            name="username"
            autocomplete="username"
            required
          >
        </div>
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <div class="input-box">
          <i class="fa-solid fa-key"></i>
          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            name="password"
            [(ngModel)]="password"
            autocomplete="current-password"
            required
          >
        </div>
      </div>

      <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button class="submit-button" type="submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Sign in</span>
        <span *ngIf="isLoading">Signing in…</span>
      </button>

      <p class="hint">Secure access for authorized users only.</p>
    </form>
  </div>
</div>
