<div class="settings-container">
  <!-- Header -->
  <div class="settings-header">
    <div class="settings-title">
      <i class="fa-solid fa-gear"></i>
      <span>Ρυθμίσεις</span>
    </div>
    <span class="close-btn" (click)="closeModal()">&times;</span>
  </div>

  <!-- Body: two columns -->
  <div class="settings-body">
    <!-- Left column: menu -->
    <div class="settings-sidebar">
      <ul>
        <li *ngFor="let item of menuItems"
            [ngClass]="{'active': activeSection === item.id}"
            (click)="selectSection(item.id)">
          {{ item.label }}
        </li>
      </ul>
    </div>

    <!-- Right column: content -->
    <div class="settings-content">
      <div *ngIf="activeSection === 'parametric'" class="settings-panel">
        <h4>Τύπος</h4>
        <p class="settings-hint">Κάθε γραμμή αντιστοιχεί σε μία τιμή</p>
        <textarea class="settings-textarea"
                  [(ngModel)]="parametricValues"
                  rows="10"
                  placeholder="Γράψτε μία τιμή ανά γραμμή..."></textarea>
        <div class="settings-actions">
          <button class="btn-save" (click)="saveParametricValues()">Αποθήκευση</button>
        </div>
      </div>


      <div *ngIf="activeSection === 'who'" class="settings-panel">
        <h4>Ποιος</h4>
        <p class="settings-hint">Κάθε γραμμή αντιστοιχεί σε μία τιμή</p>
        <textarea class="settings-textarea"
                  [(ngModel)]="whoValues"
                  rows="10"
                  placeholder="Γράψτε μία τιμή ανά γραμμή..."></textarea>
        <div class="settings-actions">
          <button class="btn-save" (click)="saveWhoValues()">Αποθήκευση</button>
        </div>
      </div>

      <!-- 'fromWho' (Όνομα) removed from parametric settings: now a free text field in the business form -->

      <div *ngIf="activeSection === 'details'" class="settings-panel">
        <h4>Λεπτομέρειες</h4>
        <p class="settings-hint">Κάθε γραμμή αντιστοιχεί σε μία τιμή</p>
        <textarea class="settings-textarea"
                  [(ngModel)]="detailsValues"
                  rows="10"
                  placeholder="Γράψτε μία τιμή ανά γραμμή..."></textarea>
        <div class="settings-actions">
          <button class="btn-save" (click)="saveDetailsValues()">Αποθήκευση</button>
        </div>
      </div>

      <div *ngIf="activeSection === 'area'" class="settings-panel">
        <h4>Περιοχή</h4>
        <p class="settings-hint">Κάθε γραμμή αντιστοιχεί σε μία τιμή</p>
        <textarea class="settings-textarea"
                  [(ngModel)]="areaValues"
                  rows="10"
                  placeholder="Γράψτε μία τιμή ανά γραμμή..."></textarea>
        <div class="settings-actions">
          <button class="btn-save" (click)="saveAreaValues()">Αποθήκευση</button>
        </div>
      </div>
    </div>
  </div>
</div>
