<div class="stats-container">
  <div class="summary-cards">
    <div class="card">
      <h3>Total Businesses</h3>
      <p class="value">{{ totalBusinesses }}</p>
    </div>

    <div class="card">
      <h3>Total Income</h3>
      <p class="value">{{ totalIncome| currency:'EUR':'symbol':'1.2-2' }}</p>
    </div>
  </div>

  <div class="filter-section">
    <label>
      From: <input type="date" [(ngModel)]="fromDate">
    </label>
    <label>
      To: <input type="date" [(ngModel)]="toDate">
    </label>
    <button (click)="loadData()">Filter</button>
    <button (click)="clearData()">Clear</button>
  </div>

</div>
